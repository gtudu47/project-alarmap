name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run check
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run config:init
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: curl --fail http://localhost:8080/api/v1/health/ready
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d alarmap-postgres
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
