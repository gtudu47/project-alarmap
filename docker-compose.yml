name: alarmap

x-api-environment: &api-environment
  NODE_ENV: production
  API_PORT: 3000
  TRUST_PROXY: 1
  DB_HOST: alarmap-postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:?Exécuter npm run config:init}
  DB_PASSWORD: ${DB_PASSWORD:?Secret PostgreSQL requis}
  DB_NAME: ${DB_NAME:-alarmap}
  JWT_SECRET: ${JWT_SECRET:?Secret JWT requis}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://alarmap-minio:9000
  S3_BUCKET: ${S3_BUCKET:-alarmap}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Identifiant MinIO requis}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Secret MinIO requis}
  S3_REGION: ${S3_REGION:-us-east-1}
  INSTALL_CHANNEL: main

services:
  alarmap-postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  alarmap-minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [minio-data:/data]

  storage-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [alarmap-minio]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-alarmap}
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        n=0;
        until mc alias set local http://alarmap-minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null 2>&1;
        do n=$$((n+1)); if [ "$$n" -ge 30 ]; then echo 'MinIO indisponible'; exit 1; fi; sleep 2; done;
        mc mb --ignore-existing "local/$$S3_BUCKET"

  migrate:
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    environment: *api-environment
    command: [node, apps/api/dist/migrate.js]
    depends_on:
      alarmap-postgres: { condition: service_healthy }

  alarmap-api:
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      start_period: 15s
      retries: 12

  alarmap-editor:
    build: { context: ., dockerfile: docker/Dockerfile, target: editor }
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 10s
      timeout: 5s
      retries: 12

  alarmap-viewer:
    build: { context: ., dockerfile: docker/Dockerfile, target: viewer }
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 10s
      timeout: 5s
      retries: 12

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:8080:80']
    volumes: [./docker/proxy.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      alarmap-api: { condition: service_healthy }
      alarmap-editor: { condition: service_healthy }
      alarmap-viewer: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/v1/health/ready]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  postgres-data:
  minio-data:
