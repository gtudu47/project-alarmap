# Docker renouvelle les adresses des services lors des reconstructions.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream alarmap_api { zone alarmap_api 64k; server alarmap-api:3000 resolve; }
upstream alarmap_editor { zone alarmap_editor 64k; server alarmap-editor:80 resolve; }
upstream alarmap_viewer { zone alarmap_viewer 64k; server alarmap-viewer:80 resolve; }
server {
  listen 80;
  server_name _;
  client_max_body_size 10m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /api/ {
    proxy_pass http://alarmap_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /viewer { return 302 /viewer/; }
  location /viewer/ { proxy_pass http://alarmap_viewer/; }
  location /embed/ { proxy_pass http://alarmap_viewer/; }
  location / {
    proxy_pass http://alarmap_editor;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
  }
}
